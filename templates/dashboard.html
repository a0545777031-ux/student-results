{% extends "base.html" %}
{% block title %}لوحتي - تحليل نتائج الطلاب{% endblock %}
{% block footer %}{% endblock %}
{% block body %}
<div class="dash">
  <aside class="side">
    <div class="who">
      <b id="uName">—</b><span id="uEmail"></span>
    </div>
    <button class="navi active" data-sec="upload"><span>📥</span><span data-i18n="dash_upload"></span></button>
    <button class="navi" data-sec="analysis"><span>📊</span><span data-i18n="dash_analysis"></span></button>
    <button class="navi" data-sec="files"><span>🗂️</span><span data-i18n="dash_files"></span></button>
    <a href="#" id="logoutSide"><span>🚪</span><span data-i18n="logout"></span></a>
  </aside>
  <main class="main">
    <!-- UPLOAD -->
    <section id="sec-upload">
      <div class="page-head"><h1 data-i18n="upload_title"></h1></div>
      <div class="msg" id="upMsg"></div>
      <div class="drop" id="drop">
        <div class="ic">☁️⬆️</div>
        <p data-i18n="upload_hint"></p>
        <input type="file" id="fileInput" multiple accept=".pdf,.xlsx,.xls,.csv" class="hidden">
        <button class="btn ghost" id="pickBtn" type="button">＋</button>
      </div>
      <div class="filelist" id="fileList"></div>
      <div style="margin-top:16px"><button class="btn" id="uploadBtn" disabled>
        <span data-i18n="upload_btn"></span></button></div>
    </section>

    <!-- ANALYSIS -->
    <section id="sec-analysis" class="hidden">
      <div class="page-head">
        <h1 data-i18n="analysis_title"></h1>
        <div class="toolbar">
          <div class="ms" id="sourceMS">
            <button type="button" class="ms-btn" id="sourceBtn"><span id="sourceLbl"></span><span class="ms-caret">▾</span></button>
            <div class="ms-panel hidden" id="sourcePanel"></div>
          </div>
          <button class="btn sm ghost" id="editBands">🎯 <span data-i18n="edit_bands"></span></button>
          <button class="btn sm gold" id="dlExcel">⬇️ <span data-i18n="dl_excel"></span></button>
          <button class="btn sm" id="repPdf">📄 <span data-i18n="report_pdf"></span></button>
          <button class="btn sm ghost" id="repWord">📝 <span data-i18n="report_word"></span></button>
        </div>
      </div>
      <div id="noData" class="card" style="text-align:center;color:var(--muted)"><span data-i18n="no_data"></span></div>

      <!-- RATING BANDS GATE: define from-to for each rating before analysis -->
      <div id="bandsGate" class="card compact hidden">
        <h3 style="margin:0 0 4px;color:var(--green-d)" data-i18n="bands_title"></h3>
        <p class="hint" data-i18n="bands_hint"></p>
        <div class="bands-form" id="bandsForm"></div>
        <div id="bandsMsg" class="msg"></div>
        <div style="margin-top:14px"><button class="btn gold" id="bandsConfirm">✔ <span data-i18n="bands_confirm"></span></button></div>
      </div>

      <div id="analysisBody" class="hidden">
        <div class="kpi" id="kpi"></div>
        <div class="card compact">
          <label style="margin-top:0" data-i18n="select_fields"></label>
          <div class="fields" id="fieldChips"></div>
          <div class="toolbar">
            <label style="margin:0"><span data-i18n="term"></span>:</label>
            <select id="termSel">
              <option value="t1" data-i18n="term1"></option>
              <option value="t2" data-i18n="term2"></option>
            </select>
            <label style="margin:0"><span data-i18n="subject"></span>:</label>
            <select id="subjSel"></select>
          </div>
        </div>

        <!-- RATINGS -->
        <div class="chartcard full ratings-card">
          <h3 data-i18n="ratings_title"></h3>
          <p class="hint" data-i18n="ratings_hint"></p>
          <div id="ratings" class="ratings"></div>
          <div id="ratingNames" class="rating-names"></div>
        </div>

        <!-- RATING MATRIX: subjects x rating levels -->
        <div class="chartcard full">
          <h3 data-i18n="matrix_title"></h3>
          <p class="hint" data-i18n="matrix_hint"></p>
          <div class="tablewrap" style="max-height:none"><table class="data compact matrix" id="ratingMatrix"></table></div>
          <div id="matrixNames" class="rating-names"></div>
        </div>

        <div class="charts compact3">
          <div class="chartcard"><h3 data-i18n="chart_subject_avg"></h3><canvas id="chSubjAvg" height="120"></canvas></div>
          <div class="chartcard"><h3 data-i18n="chart_dist"></h3><canvas id="chDist" height="120"></canvas></div>
          <div class="chartcard full"><h3 data-i18n="chart_perSubject"></h3><canvas id="chCompare" height="130"></canvas></div>
          <div class="chartcard full"><h3 data-i18n="chart_student"></h3>
            <select id="studentSel" style="margin-bottom:6px;max-width:340px"></select>
            <canvas id="chStudent" height="175"></canvas></div>
          <div class="chartcard full"><h3 data-i18n="chart_top"></h3><canvas id="chTop" height="160"></canvas></div>
        </div>
        <div style="margin-top:18px">
          <div class="tablewrap"><table class="data compact" id="dataTable"></table></div>
        </div>
      </div>
    </section>

    <!-- FILES -->
    <section id="sec-files" class="hidden">
      <div class="page-head"><h1 data-i18n="dash_files"></h1></div>
      <div class="tablewrap"><table class="data" id="filesTable"></table></div>
    </section>
  </main>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/minichart.js?v={{ ASSET_V }}"></script>
<script src="/static/js/dashboard.js?v={{ ASSET_V }}"></script>
{% endblock %}
